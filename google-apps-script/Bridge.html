<!DOCTYPE html>
<html>
<head><base target="_top"></head>
<body>
<script>
  const ALLOWED_ORIGINS = ['https://tiis-consortium.org', 'https://www.tiis-consortium.org'];
  window.addEventListener('message', function(event) {
    if (!ALLOWED_ORIGINS.includes(event.origin)) return;
    const data = event.data;
    if (!data || data.type !== 'TIIS_SUBMIT' || !data.requestId) return;
    google.script.run
      .withSuccessHandler(function(result) {
        window.parent.postMessage({
          type: 'TIIS_SUBMIT_RESULT',
          requestId: data.requestId,
          ok: true,
          result: result
        }, event.origin);
      })
      .withFailureHandler(function(error) {
        window.parent.postMessage({
          type: 'TIIS_SUBMIT_RESULT',
          requestId: data.requestId,
          ok: false,
          error: error && error.message ? error.message : 'Submission failed.'
        }, event.origin);
      })
      .processSubmission(data.payload);
  });
  window.parent.postMessage({ type: 'TIIS_BRIDGE_READY' }, '*');
</script>
</body>
</html>
