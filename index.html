<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIIS Consortium | Technology and Information Institutions Consortium</title>
  <meta name="description" content="Technology and Information Institutions Consortium (TIIS Consortium) ,  Connecting Institutions. Advancing Computing. Shaping the Future." />

  <!-- Google Fonts: Manrope (Headings 600/700) & Inter (Body 400/500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="./assets/js/tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./assets/css/site.css" />
</head>
<body class="antialiased flex flex-col min-h-screen">

  <!-- ===================================================================== -->
  <!-- STICKY MINIMALIST TOP NAVIGATION BAR                                  -->
  <!-- ===================================================================== -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-18 gap-4">
        <!-- Minimalist Geometric Logo + Brand Title -->
        <button
          type="button"
          onclick="navigateTo('home')"
          class="flex items-center gap-2.5 text-left focus:outline-none shrink-0"
          aria-label="TIIS Consortium Home"
        >
          <!-- Clean 3-Element Geometric SVG Mark: Academic Frame + Open Book + Network Nodes -->
          <svg class="w-9 h-9 shrink-0" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TIIS Logo">
            <!-- 1. Academic Frame -->
            <rect x="2" y="2" width="36" height="36" rx="8" fill="#102A4C"/>
            <!-- 2. Open Academic Book -->
            <path d="M10 23.5C13.5 22.5 16.8 23.2 20 25C23.2 23.2 26.5 22.5 30 23.5V29.5C26.5 28.5 23.2 29.2 20 31C16.8 29.2 13.5 28.5 10 29.5V23.5Z" fill="#FFFFFF"/>
            <path d="M20 25V31" stroke="#102A4C" stroke-width="1.4" stroke-linecap="round"/>
            <!-- 3. Connected Network Nodes -->
            <path d="M12.5 14.5L20 11L27.5 14.5" stroke="#16A6A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12.5" cy="14.5" r="2.2" fill="#FFFFFF"/>
            <circle cx="20" cy="11" r="2.4" fill="#16A6A1"/>
            <circle cx="27.5" cy="14.5" r="2.2" fill="#FFFFFF"/>
          </svg>
          <div>
            <span class="font-heading font-bold text-base sm:text-lg tracking-tight text-navy block leading-none">
              TIIS CONSORTIUM
            </span>
            <span class="hidden sm:block text-[11px] text-slate-500 mt-1 leading-none">
              International Academic Network
            </span>
          </div>
        </button>

        <!-- Center Concise 8-Page Navigation (Desktop) -->
        <nav class="hidden lg:flex items-center gap-5 text-sm text-slate-600" aria-label="Primary Navigation">
          <button type="button" data-nav="home" onclick="navigateTo('home')" class="nav-btn active py-1 hover:text-navy">Home</button>
          <button type="button" data-nav="about" onclick="navigateTo('about')" class="nav-btn py-1 hover:text-navy">About</button>
          <button type="button" data-nav="membership" onclick="navigateTo('membership')" class="nav-btn py-1 hover:text-navy">Membership</button>
          <button type="button" data-nav="activities" onclick="navigateTo('activities')" class="nav-btn py-1 hover:text-navy">Activities</button>
          <button type="button" data-nav="events" onclick="navigateTo('events')" class="nav-btn py-1 hover:text-navy">Events</button>
          <button type="button" data-nav="institutions" onclick="navigateTo('institutions')" class="nav-btn py-1 hover:text-navy">Members</button>
          <button type="button" data-nav="news" onclick="navigateTo('news')" class="nav-btn py-1 hover:text-navy">News</button>
          <button type="button" data-nav="contact" onclick="navigateTo('contact')" class="nav-btn py-1 hover:text-navy">Contact</button>
        </nav>

        <!-- Right CTA + Mobile Menu Toggle -->
        <div class="flex items-center gap-2.5">
          <button
            type="button"
            onclick="navigateTo('membership', 'membership-form')"
            class="hidden sm:inline-flex items-center justify-center px-4 py-2 rounded-lg bg-royal hover:bg-royal-dark text-white font-heading font-semibold text-xs sm:text-sm transition-colors"
          >
            Become a Member
          </button>

          <button
            type="button"
            id="mobile-toggle"
            onclick="toggleMobileMenu()"
            class="lg:hidden p-2 rounded-lg border border-slate-200 text-navy hover:bg-surface focus:outline-none"
            aria-label="Toggle Menu"
            aria-expanded="false"
          >
            <svg id="icon-open" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg id="icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Clean Mobile Menu Drawer -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white border-t border-slate-200">
      <div class="max-w-6xl mx-auto px-4 py-3 space-y-1 text-sm">
        <button type="button" data-mnav="home" onclick="navigateTo('home')" class="block w-full text-left px-3 py-2 rounded-lg font-medium text-royal bg-surface">Home</button>
        <button type="button" data-mnav="about" onclick="navigateTo('about')" class="block w-full text-left px-3 py-2 rounded-lg text-slate-700 hover:bg-surface">About</button>
        <button type="button" data-mnav="membership" onclick="navigateTo('membership')" class="block w-full text-left px-3 py-2 rounded-lg text-slate-700 hover:bg-surface">Membership</button>
        <button type="button" data-mnav="activities" onclick="navigateTo('activities')" class="block w-full text-left px-3 py-2 rounded-lg text-slate-700 hover:bg-surface">Activities</button>
        <button type="button" data-mnav="events" onclick="navigateTo('events')" class="block w-full text-left px-3 py-2 rounded-lg text-slate-700 hover:bg-surface">Events</button>
        <button type="button" data-mnav="institutions" onclick="navigateTo('institutions')" class="block w-full text-left px-3 py-2 rounded-lg text-slate-700 hover:bg-surface">Members</button>
        <button type="button" data-mnav="news" onclick="navigateTo('news')" class="block w-full text-left px-3 py-2 rounded-lg text-slate-700 hover:bg-surface">News</button>
        <button type="button" data-mnav="contact" onclick="navigateTo('contact')" class="block w-full text-left px-3 py-2 rounded-lg text-slate-700 hover:bg-surface">Contact</button>
        <div class="pt-2 border-t border-slate-200">
          <button
            type="button"
            onclick="navigateTo('membership', 'membership-form')"
            class="w-full py-2.5 px-4 rounded-lg bg-royal hover:bg-royal-dark text-white font-heading font-semibold text-sm text-center"
          >
            Become a Member
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- MAIN CONTENT VIEWS (8 PAGES)                                          -->
  <!-- ===================================================================== -->
  <main id="page-container" class="flex-grow" aria-live="polite"></main>

  <!-- ===================================================================== -->
  <!-- CLEAN ARTICLE READER MODAL                                            -->
  <!-- ===================================================================== -->
  <div
    id="news-modal"
    class="hidden fixed inset-0 z-50 bg-navy/70 flex items-center justify-center p-4"
    onclick="closeNewsModal()"
    role="dialog"
    aria-modal="true"
  >
    <div class="bg-white rounded-lg border border-slate-200 max-w-xl w-full overflow-hidden" onclick="event.stopPropagation()">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between gap-4">
        <span id="modal-cat" class="text-xs font-heading font-bold uppercase tracking-wider text-teal"></span>
        <button
          type="button"
          onclick="closeNewsModal()"
          class="text-slate-500 hover:text-navy text-sm font-heading font-semibold"
        >
          Close &times;
        </button>
      </div>
      <div class="p-6 space-y-4">
        <h2 id="modal-title" class="text-xl font-heading font-bold text-navy leading-snug"></h2>
        <div id="modal-body" class="text-sm text-slate-600 leading-relaxed space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- MINIMAL 3-COLUMN FOOTER (#102A4C)                                     -->
  <!-- ===================================================================== -->
  <footer class="bg-navy text-white border-t border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="grid md:grid-cols-12 gap-8 pb-8 border-b border-white/15">
        <!-- Column 1: Brand & Tagline -->
        <div class="md:col-span-5 space-y-2.5">
          <div class="font-heading font-bold text-base tracking-tight text-white">
            TIIS CONSORTIUM
          </div>
          <p class="text-xs text-slate-300">
            Technology and Information Institutions Consortium
          </p>
          <p class="text-xs font-heading font-semibold text-teal">
            Connecting Institutions. Advancing Computing. Shaping the Future.
          </p>
        </div>

        <!-- Column 2: Quick Links (All 8 Pages) -->
        <div class="md:col-span-4 space-y-2.5">
          <div class="text-xs font-heading font-bold uppercase tracking-wider text-slate-300">Quick Links</div>
          <div class="grid grid-cols-2 gap-y-2 gap-x-4 text-xs text-slate-300">
            <button type="button" onclick="navigateTo('home')" class="text-left hover:text-teal">Home</button>
            <button type="button" onclick="navigateTo('events')" class="text-left hover:text-teal">Events</button>
            <button type="button" onclick="navigateTo('about')" class="text-left hover:text-teal">About</button>
            <button type="button" onclick="navigateTo('institutions')" class="text-left hover:text-teal">Members</button>
            <button type="button" onclick="navigateTo('membership')" class="text-left hover:text-teal">Membership</button>
            <button type="button" onclick="navigateTo('news')" class="text-left hover:text-teal">News</button>
            <button type="button" onclick="navigateTo('activities')" class="text-left hover:text-teal">Activities</button>
            <button type="button" onclick="navigateTo('contact')" class="text-left hover:text-teal">Contact</button>
          </div>
        </div>

        <!-- Column 3: Contact & Copyright -->
        <div class="md:col-span-3 space-y-2 text-xs text-slate-300">
          <div class="font-heading font-bold uppercase tracking-wider text-slate-300">Contact</div>
          <p>
            <a href="mailto:info@tiis-consortium.org" class="hover:text-teal">info@tiis-consortium.org</a>
          </p>
          <p>www.tiis-consortium.org</p>
        </div>
      </div>

      <div class="pt-6 text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>&copy; 2027 TIIS Consortium &middot; Proposed Academic Consortium Initiative</p>
        <p>All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <!-- ===================================================================== -->
  <!-- APPLICATION SCRIPT                                                    -->
  <!-- ===================================================================== -->
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
