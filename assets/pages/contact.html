<section id="page-contact" class="page-view">
  <section class="bg-white"><div class="max-w-4xl mx-auto px-6 py-20">
    <p class="text-sm font-semibold tracking-wide text-teal uppercase">Contact</p>
    <h1 class="mt-4 text-4xl sm:text-5xl font-heading font-semibold tracking-tight text-navy">We'd be glad to hear from you.</h1>
    <p class="mt-6 text-lg text-slate-600">For general questions and partnership inquiries, contact the TIIS Secretariat.</p>
    <div class="mt-10 grid sm:grid-cols-2 gap-8 border-t border-slate-200 pt-8">
      <div><p class="text-sm text-slate-500">Email</p><a href="mailto:info@tiis-consortium.org" class="mt-2 inline-block text-lg font-semibold text-navy hover:text-royal">info@tiis-consortium.org</a><button type="button" onclick="copyEmail()" class="ml-3 text-sm text-royal font-semibold">Copy</button></div>
      <div><p class="text-sm text-slate-500">Website</p><p class="mt-2 text-lg font-semibold text-navy">tiis-consortium.org</p></div>
    </div>
    <div class="mt-14 border-t border-slate-200 pt-8"><h2 class="text-xl font-semibold text-navy">Send an inquiry</h2>
      <form id="inquiry-form" onsubmit="submitInquiry(event)" class="mt-6 grid sm:grid-cols-2 gap-5">
        <div><label for="inq-name" class="block text-sm font-medium text-navy mb-1">Name *</label><input id="inq-name" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-navy" /></div>
        <div><label for="inq-inst" class="block text-sm font-medium text-navy mb-1">Institution *</label><input id="inq-inst" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-navy" /></div>
        <div class="sm:col-span-2"><label for="inq-email" class="block text-sm font-medium text-navy mb-1">Email *</label><input id="inq-email" type="email" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-navy" /></div>
        <div class="sm:col-span-2"><label for="inq-msg" class="block text-sm font-medium text-navy mb-1">Message *</label><textarea id="inq-msg" rows="4" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-navy"></textarea></div>
        <div class="sm:col-span-2 flex justify-end"><button type="submit" class="rounded-full bg-navy text-white px-6 py-3 text-sm font-semibold hover:bg-royal">Send inquiry</button></div>
      </form>
      <div id="inquiry-confirmation" class="hidden mt-6 rounded-2xl bg-surface p-6"><p class="font-semibold text-navy">Thank you for your message.</p><p class="mt-2 text-sm text-slate-600">Reference: <span id="inq-ref" class="font-semibold"></span></p><button type="button" onclick="resetInquiry()" class="mt-5 text-royal text-sm font-semibold">Send another inquiry</button></div>
    </div>
  </div></section>
</section>
